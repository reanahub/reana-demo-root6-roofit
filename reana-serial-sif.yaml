# Demo: run a serial workflow whose environment is a Singularity/Apptainer
# ``.sif`` image (instead of a Docker registry reference).
#
# Before running, build the image locally and upload it with the workflow:
#
#     apptainer build reana-env-root6.sif \
#         docker://docker.io/reanahub/reana-env-root6:6.18.04
#
# The file is listed under ``inputs.files`` so ``reana-client upload`` copies it
# into the workspace root, where the steps below reference it as
# ``reana-env-root6.sif``. (``*.sif`` is git-ignored so the binary is not
# committed.)
version: 0.6.0
inputs:
  files:
    - code/gendata.C
    - code/fitdata.C
    - reana-env-root6.sif
  parameters:
    events: 20000
    data: results/data.root
    plot: results/plot.png
workflow:
  type: serial
  specification:
    steps:
      - name: gendata
        environment: "reana-env-root6.sif"
        kubernetes_memory_limit: "256Mi"
        commands:
          - mkdir -p results && root -b -q 'code/gendata.C(${events},"${data}")'
      - name: fitdata
        environment: "reana-env-root6.sif"
        kubernetes_memory_limit: "256Mi"
        commands:
          - root -b -q 'code/fitdata.C("${data}","${plot}")'
outputs:
  files:
    - results/plot.png
