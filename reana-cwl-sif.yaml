# Demo: run a CWL workflow whose environment is a Singularity/Apptainer
# ``.sif`` image (instead of a Docker registry reference).
#
# Before running, build the image locally and upload it with the workflow:
#
#     apptainer build reana-env-root6.sif \
#         docker://docker.io/reanahub/reana-env-root6:6.18.04
#
# The file is listed under ``inputs.files`` so ``reana-client upload`` copies it
# into the workspace root, where the tools in
# ``workflow/cwl`` reference it as
# ``reana-env-root6.sif``. (``*.sif`` is git-ignored so the binary is not
# committed.)
version: 0.6.0
inputs:
  files:
    - code/gendata.C
    - code/fitdata.C
    - reana-env-root6.sif
  directories:
    - workflow/cwl
  parameters:
    input: workflow/cwl/input.yml
workflow:
  type: cwl
  file: workflow/cwl/workflow-sif.cwl
  directories:
    - workflow/cwl
outputs:
  files:
    - outputs/plot.png
