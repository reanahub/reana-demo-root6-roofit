version: 0.6.0
inputs:
  files:
    - code/gendata.C
    - code/fitdata.C
  parameters:
    events: 20000
    data: results/data.root
    plot: results/plot.png
workflow:
  type: serial
  specification:
    steps:
      - name: gendata
        environment: "/cvmfs/unpacked.cern.ch/registry.hub.docker.com/rootproject/root:6.28.04-fedora37"
        kubernetes_memory_limit: "256Mi"
        commands:
          - mkdir -p results && root -b -q 'code/gendata.C(${events},"${data}")'
      - name: fitdata
        environment: "/cvmfs/unpacked.cern.ch/registry.hub.docker.com/rootproject/root:6.28.04-fedora37"
        kubernetes_memory_limit: "256Mi"
        commands:
          - root -b -q 'code/fitdata.C("${data}","${plot}")'
outputs:
  files:
    - results/plot.png
